<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <stop />
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#090d16" stroke="url(#neonGrad)" stroke-width="2.5" />

  
  <circle cx="50" cy="14" r="3" fill="#10b981" />

  
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <line x1="21" y1="21" x2="21" y2="43" stroke="#f8fafc" stroke-width="4.5" />
    
    
    <polyline points="30,21 38.5,43 47,21" stroke="url(#neonGrad)" stroke-width="4.5" />
  </g>
</svg>